<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Windows Server 2022 Interactive Quiz</title>
    <style>
        :root {
            --bg: #edf3f8;
            --surface: #ffffff;
            --surface-soft: #f7fafc;
            --text: #17212b;
            --muted: #64748b;
            --line: #dce6ef;
            --primary: #0f6cbd;
            --primary-dark: #0a4f8a;
            --primary-soft: #e7f2fd;
            --success: #21885f;
            --success-soft: #e6f6ee;
            --danger: #b42318;
            --danger-soft: #fee9e7;
            --shadow: 0 24px 60px rgba(22, 45, 72, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            padding: max(32px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                linear-gradient(135deg, rgba(15, 108, 189, 0.14), rgba(33, 136, 95, 0.12)),
                var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        button {
            font: inherit;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .quiz-container {
            width: min(100%, 760px);
            padding: 28px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.78);
            border-radius: 8px;
            box-shadow: var(--shadow);
            animation: fadeUp 0.45s cubic-bezier(.2, .8, .2, 1) both;
            overflow: hidden;
        }

        .quiz-title {
            margin: 0 0 6px;
            font-size: 1.45rem;
            line-height: 1.2;
            font-weight: 750;
            letter-spacing: 0;
        }

        .quiz-subtitle {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .header {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--line);
        }

        .progress-wrap {
            min-width: 0;
        }

        .progress {
            margin-bottom: 10px;
            color: var(--primary-dark);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            overflow: hidden;
            background: #e8eef5;
            border-radius: 8px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--success));
            border-radius: inherit;
            transition: width 0.35s ease;
        }

        .score {
            min-width: 104px;
            padding: 10px 14px;
            color: var(--success);
            background: var(--success-soft);
            border: 1px solid rgba(33, 136, 95, 0.18);
            border-radius: 8px;
            font-weight: 750;
            text-align: center;
        }

        .question-text {
            margin: 0 0 22px;
            color: var(--text);
            font-size: 1.12rem;
            font-weight: 650;
            line-height: 1.55;
            overflow-wrap: anywhere;
        }

        .question-text.animate-in {
            animation: fadeSlide 0.35s cubic-bezier(.2, .8, .2, 1) both;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            width: 100%;
            min-height: 54px;
            padding: 15px 17px;
            color: #243241;
            background: var(--surface-soft);
            border: 1px solid var(--line);
            border-radius: 8px;
            text-align: left;
            line-height: 1.45;
            cursor: pointer;
            overflow-wrap: anywhere;
            opacity: 1;
            transform: translateY(0);
            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .option-btn.animate-in {
            animation: optionIn 0.35s cubic-bezier(.2, .8, .2, 1) both;
        }

        .option-btn:hover:not([disabled]),
        .option-btn:focus-visible:not([disabled]) {
            color: var(--primary-dark);
            background: var(--primary-soft);
            border-color: rgba(15, 108, 189, 0.38);
            box-shadow: 0 10px 24px rgba(15, 108, 189, 0.12);
            outline: none;
            transform: translateY(-2px);
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct {
            color: #0f5132 !important;
            background: var(--success-soft) !important;
            border-color: rgba(33, 136, 95, 0.44) !important;
            font-weight: 750;
            animation: correctPulse 0.45s ease;
        }

        .option-btn.wrong {
            color: var(--danger) !important;
            background: var(--danger-soft) !important;
            border-color: rgba(180, 35, 24, 0.35) !important;
            animation: wrongShake 0.35s ease;
        }

        .next-btn,
        .restart-btn {
            min-height: 50px;
            padding: 14px 18px;
            color: #ffffff;
            background: var(--primary);
            border: 0;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 750;
            cursor: pointer;
            transition:
                background-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .next-btn {
            display: none;
            width: 100%;
            margin-top: 24px;
        }

        .next-btn.show {
            display: block;
            animation: fadeUp 0.25s ease both;
        }

        .next-btn:hover,
        .restart-btn:hover,
        .next-btn:focus-visible,
        .restart-btn:focus-visible {
            background: var(--primary-dark);
            box-shadow: 0 12px 24px rgba(15, 108, 189, 0.24);
            outline: none;
            transform: translateY(-1px);
        }

        .result-screen {
            padding: 12px 0 2px;
            text-align: center;
            animation: fadeUp 0.4s cubic-bezier(.2, .8, .2, 1) both;
        }

        .result-screen h2 {
            margin: 0 0 10px;
            font-size: 1.7rem;
            letter-spacing: 0;
        }

        .result-screen p {
            margin: 0 auto 22px;
            max-width: 420px;
            color: var(--muted);
            line-height: 1.55;
        }

        .final-score {
            display: inline-block;
            margin-bottom: 16px;
            padding: 12px 16px;
            color: var(--success);
            background: var(--success-soft);
            border: 1px solid rgba(33, 136, 95, 0.18);
            border-radius: 8px;
            font-size: 1.25rem;
            font-weight: 800;
        }

        .restart-btn {
            background: var(--success);
        }

        .restart-btn:hover,
        .restart-btn:focus-visible {
            background: #176c4a;
            box-shadow: 0 12px 24px rgba(33, 136, 95, 0.2);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes optionIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes correctPulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 rgba(33, 136, 95, 0);
            }
            50% {
                transform: scale(1.012);
                box-shadow: 0 0 0 6px rgba(33, 136, 95, 0.12);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 rgba(33, 136, 95, 0);
            }
        }

        @keyframes wrongShake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-4px);
            }
            75% {
                transform: translateX(4px);
            }
        }

        @media (max-width: 720px) {
            body {
                align-items: flex-start;
                padding: max(22px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
            }

            .quiz-container {
                width: 100%;
                padding: 24px;
            }

            .quiz-title {
                font-size: 1.34rem;
            }

            .quiz-subtitle {
                margin-bottom: 20px;
            }
        }

        @media (max-width: 560px) {
            body {
                align-items: flex-start;
                padding: max(14px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
            }

            .quiz-container {
                padding: 18px;
                box-shadow: 0 14px 36px rgba(22, 45, 72, 0.14);
            }

            .header {
                grid-template-columns: 1fr;
                gap: 12px;
                margin-bottom: 20px;
                padding-bottom: 18px;
            }

            .score {
                width: 100%;
                padding: 9px 12px;
            }

            .quiz-title {
                font-size: 1.25rem;
            }

            .quiz-subtitle {
                font-size: 0.9rem;
                line-height: 1.4;
            }

            .question-text {
                font-size: 1rem;
                margin-bottom: 18px;
            }

            .options-container {
                gap: 10px;
            }

            .option-btn {
                min-height: 52px;
                padding: 13px 14px;
                font-size: 0.95rem;
            }

            .next-btn,
            .restart-btn {
                min-height: 52px;
                padding: 14px;
            }
        }

        @media (max-width: 380px) {
            body {
                padding-left: max(8px, env(safe-area-inset-left));
                padding-right: max(8px, env(safe-area-inset-right));
            }

            .quiz-container {
                padding: 14px;
            }

            .quiz-title {
                font-size: 1.12rem;
            }

            .quiz-subtitle,

                font-size: 0.88rem;
            }

            .question-text {
                font-size: 0.95rem;
                line-height: 1.48;
            }

            .score {
                font-size: 0.92rem;
            }
        }

        @media (max-height: 560px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding-top: max(10px, env(safe-area-inset-top));
                padding-bottom: max(10px, env(safe-area-inset-bottom));
            }

            .quiz-container {
                padding: 16px;
            }

            .quiz-subtitle {
                margin-bottom: 14px;
            }

            .header {
                margin-bottom: 16px;
                padding-bottom: 14px;
            }

            .question-text {
                margin-bottom: 14px;
            }

            .options-container {
                gap: 8px;
            }

            .option-btn {
                min-height: 46px;
                padding: 10px 14px;
            }

            .next-btn {
                margin-top: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

</div>

let currentQuestion = 0;
let score = 0;

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const progressEl = document.getElementById("progress");
const progressFillEl = document.getElementById("progress-fill");
const scoreEl = document.getElementById("score");
const nextBtn = document.getElementById("next-btn");

function loadQuestion() {
    const q = quizData[currentQuestion];
    questionEl.innerText = q.q;
    progressEl.innerText = `Question ${currentQuestion + 1}/${quizData.length}`;
    progressFillEl.style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;
    optionsEl.innerHTML = "";
    nextBtn.classList.remove("show");
    nextBtn.style.removeProperty("display");

    questionEl.classList.remove("animate-in");
    void questionEl.offsetWidth;
    questionEl.classList.add("animate-in");

    q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.classList.add("option-btn", "animate-in");
        btn.style.animationDelay = `${index * 0.06}s`;
        btn.innerText = opt;
        btn.onclick = () => selectOption(index, q.answer);
        optionsEl.appendChild(btn);
    });
}

function selectOption(selected, correct) {
    const buttons = optionsEl.children;
    for (let i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
        if (i === correct) {
            buttons[i].classList.add("correct");
        }
        if (i === selected && selected !== correct) {
            buttons[i].classList.add("wrong");
        }
    }
    
    if (selected === correct) {
        score++;
        scoreEl.innerText = `Score: ${score}`;
    }

    nextBtn.style.removeProperty("display");
    nextBtn.classList.add("show");
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < quizData.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    progressFillEl.style.width = "100%";
    document.getElementById("quiz-body").innerHTML = `
        <div class="result-screen">
            <h2>Quiz Complete!</h2>
            <div class="final-score">${score} / ${quizData.length}</div>
            <p>Final percentage: <strong>${((score / quizData.length) * 100).toFixed(1)}%</strong></p>
            <button class="restart-btn" onclick="location.reload()">Restart Quiz</button>
        </div>
    `;
}

loadQuestion();
</script>
